<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <!-- PWA Primary Meta Tags -->

    <meta name="description" content="Aplikasi Manajemen Keuangan Pribadi PWA Fullstack Express & Vue 3" />
    <meta name="theme-color" content="#0d6efd" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ExpenseTracker" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style>

      /* Custom utility classes for elegant mobile-first design */
      .card-custom {

        border-radius: 14px;
